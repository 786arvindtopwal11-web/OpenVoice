name: "YouTube: approved reply post karo"

on:
  issues:
    types: [labeled]

concurrency:
  group: yt-post-reply-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  post:
    # Sirf repo owner ka lagaya approve/reject label hi kaam karega
    if: >-
      (github.event.label.name == 'approve' || github.event.label.name == 'reject') &&
      contains(github.event.issue.labels.*.name, 'yt-comment') &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube-comment-bot/requirements.txt

      - run: pip install -r youtube-comment-bot/requirements.txt

      - name: Post reply to YouTube
        working-directory: youtube-comment-bot
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          LABEL_NAME: ${{ github.event.label.name }}
        run: python post_reply.py
